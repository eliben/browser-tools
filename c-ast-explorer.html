<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>C AST Explorer</title>
  <meta name="description" content="Parse C code with pycparser in the browser and explore the AST.">
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f6fb;
      color: #1f2937;
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    header {
      padding: 1rem 1.2rem;
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    header h1 {
      margin: 0;
      font-size: 1.1rem;
    }

    #status {
      font-size: 0.88rem;
      color: #4b5563;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.8rem;
      padding: 0.8rem;
      min-height: 0;
    }

    .panel {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      overflow: hidden;
      min-height: 0;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .panel h2 {
      margin: 0;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.75rem 0.9rem;
      border-bottom: 1px solid #edf0f5;
      background: #fcfdff;
    }

    textarea {
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      border: 0;
      resize: none;
      padding: 0.9rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      line-height: 1.45;
      outline: none;
    }

    .tree-wrap {
      overflow: auto;
      padding: 0.7rem 0.8rem 1rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      line-height: 1.5;
    }

    details {
      margin-left: 0.5rem;
      border-left: 1px dashed #dbe1ea;
      padding-left: 0.55rem;
    }

    details > summary {
      cursor: pointer;
      list-style: none;
    }

    details > summary::-webkit-details-marker {
      display: none;
    }

    .leaf {
      margin-left: 1.6rem;
      color: #0f172a;
    }

    .kind {
      color: #1d4ed8;
      font-weight: 600;
    }

    .meta {
      color: #475569;
      font-weight: 400;
    }

    .error {
      color: #b91c1c;
      white-space: pre-wrap;
      margin: 0;
      padding: 0.8rem;
      background: #fff7f7;
      border: 1px solid #fecaca;
      border-radius: 8px;
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: 1fr;
        grid-template-rows: 45vh 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>C AST Explorer (Pyodide + pycparser)</h1>
    <div id="status">Loading Python runtime…</div>
  </header>

  <main class="grid">
    <section class="panel">
      <h2>C source code</h2>
      <textarea id="source" spellcheck="false"></textarea>
    </section>

    <section class="panel">
      <h2>AST tree (click to expand/collapse)</h2>
      <div class="tree-wrap" id="tree"></div>
    </section>
  </main>

  <script type="module">
    // Load Pyodide as an ES module directly from jsDelivr.
    // All Python execution happens fully client-side in the browser.
    import { loadPyodide } from 'https://cdn.jsdelivr.net/pyodide/v0.28.3/full/pyodide.mjs';

    const statusEl = document.getElementById('status');
    const sourceEl = document.getElementById('source');
    const treeEl = document.getElementById('tree');

    const starterCode = `int add(int a, int b) {
  return a + b;
}

int main(void) {
  int result = add(4, 5);
  return result;
}`;

    sourceEl.value = starterCode;

    let pyodide = null;
    let parseAst = null;
    let parseTimer = null;

    function setStatus(message) {
      statusEl.textContent = message;
    }

    function renderNode(node, parent, depth = 0) {
      // Each node has the shape: {kind, meta, children} and is rendered
      // recursively into <details>/<summary> (expandable) or leaf <div> elements.
      const hasChildren = Array.isArray(node.children) && node.children.length > 0;

      if (!hasChildren) {
        const leaf = document.createElement('div');
        leaf.className = 'leaf';
        leaf.style.marginLeft = `${Math.max(0, depth - 1) * 1.1 + 0.5}rem`;
        leaf.innerHTML = `<span class="kind">${node.kind}</span>${node.meta ? ` <span class="meta">(${node.meta})</span>` : ''}`;
        parent.appendChild(leaf);
        return;
      }

      const details = document.createElement('details');
      // Default to expanded view so users see the full AST immediately.
      details.open = true;

      const summary = document.createElement('summary');
      summary.innerHTML = `<span class="kind">${node.kind}</span>${node.meta ? ` <span class="meta">(${node.meta})</span>` : ''}`;
      details.appendChild(summary);

      node.children.forEach((child) => renderNode(child, details, depth + 1));
      parent.appendChild(details);
    }

    function showError(message) {
      treeEl.innerHTML = '';
      const err = document.createElement('pre');
      err.className = 'error';
      err.textContent = message;
      treeEl.appendChild(err);
    }

    async function runParse() {
      if (!parseAst) return;
      const src = sourceEl.value;

      try {
        // parseAst is a Python function proxy exposed from Pyodide.
        const result = parseAst(src);
        treeEl.innerHTML = '';
        renderNode(result, treeEl);
        setStatus('Parsed successfully');
      } catch (err) {
        setStatus('Parse error');
        showError(String(err));
      }
    }

    function scheduleParse() {
      // Debounce parsing while typing to avoid parsing on every keystroke.
      clearTimeout(parseTimer);
      parseTimer = setTimeout(runParse, 220);
    }

    async function init() {
      try {
        // Boot Python runtime in-browser, then install pycparser dynamically.
        pyodide = await loadPyodide();
        setStatus('Installing pycparser…');
        await pyodide.loadPackage('micropip');
        const micropip = pyodide.pyimport('micropip');
        await micropip.install('pycparser');

        // Define helper functions in Python to parse C code and convert
        // pycparser's AST node objects into plain JSON-serializable dicts.
        pyodide.runPython(`
import pycparser

def _meta_for(node):
    for attr in getattr(node, 'attr_names', ()):  # e.g. op, name, value
        try:
            val = getattr(node, attr)
        except Exception:
            continue
        if val not in (None, ''):
            return f"{attr}={val}"
    return ""


def _to_tree(node):
    children = []
    for _, child in node.children():
        children.append(_to_tree(child))
    return {
        "kind": node.__class__.__name__,
        "meta": _meta_for(node),
        "children": children,
    }


def parse_c_to_tree(source):
    parser = pycparser.CParser()
    ast = parser.parse(source)
    return _to_tree(ast)
`);

        // Grab the Python parser function and wire it to the input event.
        parseAst = pyodide.globals.get('parse_c_to_tree');
        sourceEl.addEventListener('input', scheduleParse);
        setStatus('Ready');
        await runParse();
      } catch (err) {
        setStatus('Failed to initialize');
        showError(`Initialization failed:\n${String(err)}`);
      }
    }

    init();
  </script>
</body>
</html>
