<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>C AST Explorer</title>
  <meta name="description" content="Parse C code with pycparser in the browser and explore the AST.">
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f6fb;
      color: #1f2937;
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    header {
      padding: 1rem 1.2rem;
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    header h1 {
      margin: 0;
      font-size: 1.1rem;
    }

    #status {
      font-size: 0.88rem;
      color: #4b5563;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) 10px minmax(260px, 1fr);
      padding: 0.8rem;
      min-height: 0;
      box-sizing: border-box;
    }

    .panel {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      overflow: hidden;
      min-height: 0;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .splitter {
      border-radius: 999px;
      background: #e5e7eb;
      cursor: col-resize;
      position: relative;
      width: 10px;
      touch-action: none;
    }

    .splitter::before {
      content: "";
      position: absolute;
      inset: 20% 35%;
      border-radius: 999px;
      background: #cbd5f5;
    }

    .splitter:hover {
      background: #d8dee9;
    }

    body.dragging {
      cursor: col-resize;
      user-select: none;
    }

    .panel h2 {
      margin: 0;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.75rem 0.9rem;
      border-bottom: 1px solid #edf0f5;
      background: #fcfdff;
    }

    textarea {
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      border: 0;
      resize: none;
      padding: 0.9rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      line-height: 1.45;
      outline: none;
    }

    .tree-wrap {
      overflow: auto;
      padding: 0.7rem 0.8rem 1rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      line-height: 1.5;
      --tree-indent: 1.05rem;
      --tree-indent-gutter: 0.55rem;
    }

    details {
      margin-left: calc(var(--tree-indent) - var(--tree-indent-gutter));
      border-left: 1px dashed #dbe1ea;
      padding-left: var(--tree-indent-gutter);
    }

    details > summary {
      cursor: pointer;
      list-style: none;
    }

    details > summary::-webkit-details-marker {
      display: none;
    }

    .leaf {
      margin-left: var(--tree-indent);
      color: #0f172a;
    }

    .kind {
      color: #1d4ed8;
      font-weight: 600;
    }

    .meta {
      color: #475569;
      font-weight: 400;
    }

    .error {
      color: #b91c1c;
      white-space: pre-wrap;
      margin: 0;
      padding: 0.8rem;
      background: #fff7f7;
      border: 1px solid #fecaca;
      border-radius: 8px;
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: 1fr;
        grid-template-rows: 45vh 1fr;
      }

      .splitter {
        display: none;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>C AST Explorer [pyodide (v<span id="pyodide-version">…</span>) + pycparser (v<span id="pycparser-version">…</span>)]</h1>
    <div id="status">Loading Python runtime…</div>
  </header>

  <main class="grid" id="panes">
    <section class="panel">
      <h2>C source code</h2>
      <textarea id="source" spellcheck="false"></textarea>
    </section>

    <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" aria-label="Resize panes"></div>

    <section class="panel">
      <h2>AST tree (click to expand/collapse)</h2>
      <div class="tree-wrap" id="tree"></div>
    </section>
  </main>

  <script type="module">
    // Load Pyodide as an ES module directly from jsDelivr.
    // All Python execution happens fully client-side in the browser.
    import { loadPyodide } from 'https://cdn.jsdelivr.net/pyodide/v0.28.3/full/pyodide.mjs';

    const statusEl = document.getElementById('status');
    const sourceEl = document.getElementById('source');
    const treeEl = document.getElementById('tree');
    const pyodideVersionEl = document.getElementById('pyodide-version');
    const pycparserVersionEl = document.getElementById('pycparser-version');
    const panesEl = document.getElementById('panes');
    const splitterEl = document.getElementById('splitter');

    const starterCode = `int add(int a, int b) {
  return a + b;
}

int main(void) {
  int result = add(4, 5);
  return result;
}`;

    sourceEl.value = starterCode;

    let pyodide = null;
    let parseAst = null;
    let parseTimer = null;

    function setStatus(message) {
      statusEl.textContent = message;
    }

    function setVersion(el, value) {
      if (!el) return;
      el.textContent = String(value);
    }

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function isStackedLayout() {
      return window.matchMedia('(max-width: 900px)').matches;
    }

    function applyPaneSizes(leftWidth, rightWidth, splitterWidth) {
      panesEl.style.gridTemplateColumns = `${leftWidth}px ${splitterWidth}px ${rightWidth}px`;
    }

    function initSplitter() {
      if (!splitterEl || !panesEl) return;

      let dragging = false;
      let lastRatio = 0.5;
      const minPane = 260;
      const splitterWidth = splitterEl.offsetWidth || 10;

      function getContentWidth() {
        const style = getComputedStyle(panesEl);
        const paddingLeft = parseFloat(style.paddingLeft) || 0;
        const paddingRight = parseFloat(style.paddingRight) || 0;
        return panesEl.clientWidth - paddingLeft - paddingRight;
      }

      function updateFromRatio() {
        if (isStackedLayout()) {
          panesEl.style.gridTemplateColumns = '';
          return;
        }
        const contentWidth = getContentWidth();
        const available = contentWidth - splitterWidth;
        if (available <= 0) return;
        const effectiveMin = Math.min(minPane, available / 2);
        const left = clamp(available * lastRatio, effectiveMin, available - effectiveMin);
        const right = available - left;
        applyPaneSizes(left, right, splitterWidth);
      }

      function onPointerMove(event) {
        if (!dragging) return;
        const rect = panesEl.getBoundingClientRect();
        const style = getComputedStyle(panesEl);
        const paddingLeft = parseFloat(style.paddingLeft) || 0;
        const paddingRight = parseFloat(style.paddingRight) || 0;
        const contentWidth = panesEl.clientWidth - paddingLeft - paddingRight;
        const available = contentWidth - splitterWidth;
        const effectiveMin = Math.min(minPane, available / 2);
        const maxLeft = available - effectiveMin;
        const minLeft = effectiveMin;
        const rawLeft = event.clientX - rect.left - paddingLeft;
        const left = clamp(rawLeft, minLeft, maxLeft);
        const right = available - left;
        lastRatio = left / available;
        applyPaneSizes(left, right, splitterWidth);
      }

      function stopDrag() {
        if (!dragging) return;
        dragging = false;
        document.body.classList.remove('dragging');
        window.removeEventListener('pointermove', onPointerMove);
        window.removeEventListener('pointerup', stopDrag);
      }

      splitterEl.addEventListener('pointerdown', (event) => {
        if (isStackedLayout()) return;
        dragging = true;
        splitterEl.setPointerCapture(event.pointerId);
        document.body.classList.add('dragging');
        window.addEventListener('pointermove', onPointerMove);
        window.addEventListener('pointerup', stopDrag);
      });

      window.addEventListener('resize', updateFromRatio);
      updateFromRatio();
    }

    function getNodeChildren(node) {
      if (!node || typeof node !== 'object') return [];
      const raw = node.children;
      if (Array.isArray(raw)) return raw;
      if (raw && typeof raw === 'object') return Object.values(raw);
      return [];
    }

    function buildNodeLabel(node) {
      const fragment = document.createDocumentFragment();
      const kind = document.createElement('span');
      kind.className = 'kind';
      kind.textContent = node.kind;
      fragment.appendChild(kind);

      if (node.meta !== null && node.meta !== undefined) {
        const meta = document.createElement('span');
        meta.className = 'meta';
        meta.textContent = `: ${node.meta}`;
        fragment.appendChild(meta);
      }

      return fragment;
    }

    function renderNode(node, parent) {
      // Each node has the shape: {kind, meta, children} and is rendered
      // recursively into <details>/<summary> (expandable) or leaf <div> elements.
      const children = getNodeChildren(node);
      const hasChildren = children.length > 0;

      if (!hasChildren) {
        const leaf = document.createElement('div');
        leaf.className = 'leaf';
        leaf.appendChild(buildNodeLabel(node));
        parent.appendChild(leaf);
        return;
      }

      const details = document.createElement('details');
      // Default to expanded view so users see the full AST immediately.
      details.open = true;

      const summary = document.createElement('summary');
      summary.appendChild(buildNodeLabel(node));
      details.appendChild(summary);

      children.forEach((child) => renderNode(child, details));
      parent.appendChild(details);
    }

    function showError(message) {
      treeEl.innerHTML = '';
      const err = document.createElement('pre');
      err.className = 'error';
      err.textContent = message;
      treeEl.appendChild(err);
    }

    async function runParse() {
      if (!parseAst) return;
      const src = sourceEl.value;

      try {
        // parseAst is a Python function proxy exposed from Pyodide.
        const resultJson = parseAst(src);
        const result = JSON.parse(String(resultJson));
        treeEl.innerHTML = '';
        renderNode(result, treeEl);
        setStatus('Parsed successfully');
      } catch (err) {
        setStatus('Parse error');
        showError(String(err));
      }
    }

    function scheduleParse() {
      // Debounce parsing while typing to avoid parsing on every keystroke.
      clearTimeout(parseTimer);
      parseTimer = setTimeout(runParse, 220);
    }

    async function init() {
      try {
        // Boot Python runtime in-browser, then install pycparser dynamically.
        pyodide = await loadPyodide();
        const pyodideVersion = pyodide.version || pyodide.runPython('import pyodide; pyodide.__version__');
        setVersion(pyodideVersionEl, pyodideVersion);
        setStatus('Installing pycparser…');
        await pyodide.loadPackage('micropip');
        const micropip = pyodide.pyimport('micropip');
        await micropip.install('pycparser>=3.0');
        const pycparserVersion = pyodide.runPython('import pycparser; pycparser.__version__');
        setVersion(pycparserVersionEl, pycparserVersion);

        // Define helper functions in Python to parse C code and convert
        // pycparser's AST node objects into plain JSON-serializable dicts.
        pyodide.runPython(`
import json
import pycparser

def _meta_for(node):
    attr_names = getattr(node, 'attr_names', ())
    if not attr_names:
        return None

    def is_empty(value):
        return value is None or (hasattr(value, '__len__') and len(value) == 0)

    showemptyattrs = True
    attrnames = False
    nvlist = []
    for name in attr_names:
        value = getattr(node, name)
        if showemptyattrs or not is_empty(value):
            nvlist.append((name, value))
    if attrnames:
        return ", ".join("%s=%s" % nv for nv in nvlist)
    return ", ".join("%s" % value for (_, value) in nvlist)


def _to_tree(node):
    children = []
    for _, child in node.children():
        children.append(_to_tree(child))
    return {
        "kind": node.__class__.__name__,
        "meta": _meta_for(node),
        "children": children,
    }


def parse_c_to_tree(source):
    parser = pycparser.CParser()
    ast = parser.parse(source)
    return json.dumps(_to_tree(ast))
`);

        // Grab the Python parser function and wire it to the input event.
        parseAst = pyodide.globals.get('parse_c_to_tree');
        sourceEl.addEventListener('input', scheduleParse);
        setStatus('Ready');
        await runParse();
      } catch (err) {
        setStatus('Failed to initialize');
        showError(`Initialization failed:\n${String(err)}`);
      }
    }

    initSplitter();
    init();
  </script>
</body>
</html>
